name: release

# Pushing a tag like v0.1.0 builds one binary per platform (OpenTUI's native library is per-platform, so each is built on its own runner)
# and attaches them, with checksums, to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15-intel, name: darwin-x64 }
          - { os: macos-latest, name: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: sh scripts/build.sh
      - name: Smoke test
        run: |
          ./dist/pathlight-${{ matrix.name }} --help
          ./dist/pathlight-${{ matrix.name }} doctor || true
      - uses: actions/upload-artifact@v6
        with:
          name: pathlight-${{ matrix.name }}
          path: dist/pathlight-${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && chmod +x pathlight-* && sha256sum pathlight-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/pathlight-*
            dist/SHA256SUMS

  # The OpenCode plugin as an npm package (see scripts/build-opencode.sh). Inert until the repository has an NPM_TOKEN secret: without one this job says so and passes.
  # A tag with a hyphen (v0.1.0-rc7) publishes under the `next` dist-tag, so `npm i` never picks up a pre-release.
  npm:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      - name: Publish pathlight-opencode
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "No NPM_TOKEN secret: not publishing pathlight-opencode."; exit 0; fi
          version="${TAG#v}"
          sh scripts/build-opencode.sh "$version"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          cd plugins/opencode/dist
          case "$version" in *-*) npm publish --access public --tag next ;; *) npm publish --access public ;; esac
