name: release

# Pushing a tag like v0.1.0 builds one binary per platform (OpenTUI's native library is per-platform, so each is built on its own runner)
# and attaches them, with checksums, to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15-intel, name: darwin-x64 }
          - { os: macos-latest, name: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: sh scripts/build.sh
      - name: Smoke test
        run: |
          ./dist/pathlight-${{ matrix.name }} --help
          ./dist/pathlight-${{ matrix.name }} doctor || true
      - uses: actions/upload-artifact@v6
        with:
          name: pathlight-${{ matrix.name }}
          path: dist/pathlight-${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && chmod +x pathlight-* && sha256sum pathlight-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/pathlight-*
            dist/SHA256SUMS
            LICENSE
            NOTICE.md

  # The npm packages: `@dumbbunnyio/pathlight` (the CLI, scripts/build-npm.sh: a launcher and one package per platform holding its binary), `pathlight`
  # (unscoped, a pointer to it) and `@dumbbunnyio/pathlight-opencode` (the OpenCode plugin, scripts/build-opencode.sh). Published by npm trusted
  # publishing: each package trusts this workflow in dumbbunnyio/pathlight (`npm trust list PACKAGE`), GitHub's OIDC token proves the run, and no npm
  # token is stored; npm adds provenance itself. Each package goes after the ones it names, so none points at one that is not there.
  # A version already on npm is skipped, so a re-run finishes the rest.
  # A tag with a hyphen (v0.1.0-rc7) publishes under the `next` dist-tag, so `npm i` never picks up a pre-release.
  npm:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: npm install -g npm@11 && npm --version
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [ "$(ls dist/pathlight-* | wc -l)" -eq 4 ] || { echo "expected four binaries:"; ls dist; exit 1; }
          sh scripts/build-npm.sh "$version" dist
          sh scripts/build-opencode.sh "$version"
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already published"; return; fi
            case "$version" in *-*) (cd "$1" && npm publish --access public --tag next) ;; *) (cd "$1" && npm publish --access public) ;; esac
          }
          for package in dist/npm/linux-* dist/npm/darwin-*; do publish "$package"; done
          publish dist/npm/pathlight
          publish dist/npm/pointer
          publish plugins/opencode/dist
