[package]
name = "pathlight-web"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rune is pinned to one commit; it is MIT (see NOTICE.md).
rune = { git = "https://github.com/anomalyco/rune", rev = "99c123d6b2127d1226c72dec37919e51019142ff" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "History", "Response", "Request", "RequestInit", "Headers", "EventSource", "MessageEvent", "MediaQueryList", "UrlSearchParams"] }

[workspace]
